<!doctype html>

<html lang="en-US">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ToDo</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="saving.js"> </script>
    <script src="loading.js"> </script>
  </head>

  <style>
    table, th, td {
        border: 3px solid rgb(0, 0, 0);
        border-collapse: collapse;
    }
    th, td {
        text-align: left;
        padding: 15px;
    }
    h1, h2, h3, h4, h5, h6 {
        text-align: center;
    }
    textarea {
        width: 100%;
    }
  </style>


  <body>
    <h1 style="font-size: 32px"> To-Do Lister </h1>

    <table style="width:100%"> 
        <tr>
            <th rowspan="2" style="width:50%"> 
                General
                <br>
                <textarea id="general" name="general" rows="40" cols="78" autofocus="autofocus"></textarea>
            </th>
            <th style="width:25%">
                Dates
                <br>
                <textarea id="dates" name="dates" rows="18" cols="38"></textarea>
            </th>
            <th style="width:25%"> 
                Keep In Mind
                <br>
                <textarea id="KIM" name="KIM" rows="18" cols="38"></textarea>
            </th>
        </tr>
        <tr>
            <th> 
                Projects 
                <br>
                <textarea id="projects" name="projects" rows="18" cols="38"></textarea>
            </th>
            <th> 
                Urgent
                <br>
                <textarea id="urgent" name="urgent" rows="18" cols="38"></textarea>
            </th>
        </tr>
    </table>
    <script> load() </script>
  </body>
</html>
